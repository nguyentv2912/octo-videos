name: octo-daily

on:
  schedule:
    - cron: '0 23 * * *'   # 06:00 Asia/Ho_Chi_Minh (UTC+7) -> posts at 07:00
    - cron: '0 11 * * *'   # 18:00 Asia/Ho_Chi_Minh -> posts at 19:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: octo-daily
  cancel-in-progress: false

jobs:
  render-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-inter fonts-dejavu-core

      - name: Install Python packages
        run: pip install numpy scipy opencv-python-headless pillow

      - name: Render today's video (random seed)
        working-directory: engine
        run: |
          mkdir -p out
          python3 octo_run.py

      - name: Copy video and caption into videos/
        id: files
        run: |
          set -e
          SRC=$(ls engine/out/OCTO_AI_V6_seed*.mp4 | head -n 1)
          NAME=$(basename "$SRC")
          STEM="${NAME%.mp4}"
          mkdir -p videos
          cp "$SRC" "videos/$NAME"
          cat > "videos/$STEM.txt" <<'CAPTION'
          Capital → profit: an AI tool that scans Solana meme coin signals. Illustrative video, not real trading results. Not financial advice. Is this what you're looking for?

          #Solana #memecoin #AI #crypto #buildinpublic
          CAPTION
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "stem=$STEM" >> "$GITHUB_OUTPUT"

      - name: Commit and push video
        run: |
          git config user.name "octo-bot"
          git config user.email "octo-bot@users.noreply.github.com"
          git add videos
          git commit -m "Daily OCTO video ${{ steps.files.outputs.stem }}" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done

      - name: Wait until the video is public on GitHub raw
        env:
          VIDEO_NAME: ${{ steps.files.outputs.name }}
        run: |
          URL="https://raw.githubusercontent.com/nguyentv2912/octo-videos/main/videos/$VIDEO_NAME"
          for i in $(seq 1 30); do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" -r 0-0 "$URL" || true)
            echo "attempt $i: $CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "206" ]; then exit 0; fi
            sleep 10
          done
          echo "video not reachable at $URL" && exit 1

      - name: Schedule Buffer posts (TikTok + Instagram)
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          CRON_EXPR: ${{ github.event.schedule }}
          VIDEO_NAME: ${{ steps.files.outputs.name }}
          STEM: ${{ steps.files.outputs.stem }}
        run: |
          python3 scripts/schedule_buffer.py

      - name: Save booked slots
        if: success()
        run: |
          git add scripts/booked.json
          git commit -m "Update booked Buffer slots" || echo "no slot change"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
